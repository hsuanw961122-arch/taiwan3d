<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>台地地形 AR 探索</title>

<!-- 與老師示範檔相同版本 -->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family:
      "Microsoft JhengHei",
      "Noto Sans TC",
      sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  [hidden] {
    display: none !important;
  }

  .panel {
    position: fixed;
    z-index: 10;
    left: 10px;
    right: 10px;
    max-width: 480px;
    margin: auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 12px 14px;
    border-radius: 16px;
    box-shadow: 0 4px 22px #0002;
  }

  #top {
    top: max(10px, env(safe-area-inset-top));
  }

  #bottom {
    bottom: max(10px, env(safe-area-inset-bottom));
  }

  h1 {
    font-size: 19px;
    color: #6b4a1f;
    margin: 0 0 6px;
  }

  p {
    font-size: 14px;
    line-height: 1.6;
    margin: 6px 0;
  }

  button {
    background: #8a5a22;
    color: white;
    border: 0;
    border-radius: 9px;
    padding: 11px 8px;
    font: inherit;
    font-size: 15px;
    touch-action: manipulation;
  }

  button:active {
    filter: brightness(0.85);
  }

  button:disabled {
    background: #888;
  }

  button.secondary {
    background: #4f7a3a;
  }

  button.reset {
    background: #5f6368;
  }

  #start {
    margin-top: 8px;
    width: 100%;
  }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: nowrap;
    margin-top: 8px;
  }

  .row button {
    flex: 1;
  }

  label {
    font-weight: bold;
    color: #6b4a1f;
    white-space: nowrap;
  }

  input[type="range"] {
    flex: 1;
    height: 34px;
    accent-color: #8a5a22;
    touch-action: pan-x;
  }

  .value {
    font-weight: bold;
    min-width: 48px;
    text-align: right;
  }

  .note {
    font-size: 12px;
    color: #666;
  }

  #status {
    overflow-wrap: anywhere;
  }
</style>

<script>
/* ============================================================
   auto-fit：模型載入後自動縮放並置中
   ------------------------------------------------------------
   不論 GLB 原本多大，都會縮放成「圖卡寬度的 fit 倍」，
   並把模型底部放在圖卡上、水平置中。
   ============================================================ */
AFRAME.registerComponent('auto-fit', {
  schema: {
    fit: { type: 'number', default: 0.9 }
  },

  init: function () {
    this.el.addEventListener('model-loaded', () => {
      try {
        const THREE = AFRAME.THREE;
        const mesh = this.el.getObject3D('mesh');

        // 暫時移出場景，在模型自己的座標中量大小
        const parent = mesh.parent;
        parent.remove(mesh);

        mesh.position.set(0, 0, 0);
        mesh.scale.set(1, 1, 1);
        mesh.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(mesh);
        const size = new THREE.Vector3();
        box.getSize(size);

        const longest = Math.max(size.x, size.z) || 1;
        const s = this.data.fit / longest;

        mesh.scale.setScalar(s);

        const center = new THREE.Vector3();
        box.getCenter(center);

        // 水平置中，底部貼齊圖卡
        mesh.position.set(
          -center.x * s,
          -box.min.y * s,
          -center.z * s
        );

        parent.add(mesh);

        this.el.dataset.modelReady = 'true';
        this.el.emit('terrain-ready', {}, false);

      } catch (error) {
        console.error(error);
        this.el.dataset.modelError = error.message;
        this.el.emit(
          'terrain-error',
          { message: error.message },
          false
        );
      }
    });
  }
});
</script>
</head>

<body>

<div id="top" class="panel">
  <h1>台地地形 AR 探索</h1>

  <p
    id="status"
    role="status"
    aria-live="polite"
  >
    正在載入立體地形……
  </p>

  <button id="start" disabled>
    載入中
  </button>

  <p class="note">
    地形高度經過放大處理，方便觀察起伏。
  </p>
</div>

<div id="bottom" class="panel" hidden>

  <!-- 縮放 -->
  <div class="row">
    <label for="zoom">大小</label>
    <input
      id="zoom"
      type="range"
      min="40"
      max="250"
      value="100"
      step="5"
      aria-label="模型大小百分比"
    >
    <span id="zoomValue" class="value">100%</span>
  </div>

  <div class="row">
    <button id="zoomOut">－ 縮小</button>
    <button id="zoomIn">＋ 放大</button>
  </div>

  <!-- 旋轉、角度、重設 -->
  <div class="row">
    <button id="rotateLeft" class="secondary">↺ 左轉</button>
    <button id="rotateRight" class="secondary">↻ 右轉</button>
  </div>

  <div class="row">
    <button id="view" class="secondary">換角度：平放</button>
    <button id="reset" class="reset">重設</button>
  </div>

  <p class="note">
    也可以單指左右滑動旋轉、雙指開合縮放。
    觀察：台地頂部是否平坦？邊緣坡度如何？
  </p>
</div>

<!--
  ★ 檔名設定 ★
  imageTargetSrc：你的 .mind 檔名
  gltf-model    ：你的 .glb 檔名
  兩個檔案都要和 index.html 放在 GitHub 的同一個資料夾。
-->
<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: no;
    uiScanning: no;
    uiError: no;
  "
  renderer="
    colorManagement: true;
    alpha: true;
  "
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
>
  <a-camera
    position="0 0 0"
    look-controls="enabled: false"
  ></a-camera>

  <a-entity
    light="type: ambient; intensity: 1.1"
  ></a-entity>

  <a-entity
    light="type: directional; intensity: 1.3"
    position="1 2 3"
  ></a-entity>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0"
  >
    <!-- zoom：縮放 -->
    <a-entity id="zoomBox" scale="1 1 1">
      <!-- spin：在圖卡平面上旋轉 -->
      <a-entity id="spin" rotation="0 0 0">
        <!-- tilt：切換觀看角度 -->
        <a-entity id="tilt" rotation="90 0 0">
          <a-entity
            id="terrain"
            gltf-model="url(./terrain.glb)"
            auto-fit="fit: 0.9"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
/* ============================================================
   基本設定
   ============================================================ */

// 換角度的順序：[名稱, 傾斜角度]
// 90 = 平躺在圖卡上（像放在桌上的地形模型）
const VIEWS = [
  ['平放', 90],
  ['斜看', 55],
  ['側面', 15]
];

const ZOOM_MIN = 40;
const ZOOM_MAX = 250;
const ZOOM_STEP = 20;
const ROTATE_STEP = 30;


/* ============================================================
   取得元素
   ============================================================ */

const scene = document.querySelector('a-scene');
const terrain = document.querySelector('#terrain');
const target = document.querySelector('#target');

const zoomBox = document.querySelector('#zoomBox');
const spin = document.querySelector('#spin');
const tilt = document.querySelector('#tilt');

const status = document.querySelector('#status');
const start = document.querySelector('#start');
const bottom = document.querySelector('#bottom');

const zoomSlider = document.querySelector('#zoom');
const zoomValue = document.querySelector('#zoomValue');
const viewButton = document.querySelector('#view');


/* ============================================================
   狀態
   ============================================================ */

let sceneReady = Boolean(scene.hasLoaded);
let modelReady = false;

let failed = false;
let starting = false;
let running = false;

let zoom = 100;
let angle = 0;
let viewIndex = 0;


/* ============================================================
   載入流程（沿用老師的寫法）
   ============================================================ */

function ready() {
  if (failed || running || starting) return;

  if (sceneReady && modelReady) {
    start.disabled = false;
    start.textContent = '啟動 AR 鏡頭';

    status.textContent =
      '地形已載入。啟動鏡頭後，請掃描台地圖卡。';
  }
}

function fail(message) {
  failed = true;
  running = false;
  starting = false;

  status.textContent = message;

  start.hidden = false;
  start.disabled = true;
  start.textContent = '請修正後重新整理';

  bottom.hidden = true;

  try {
    scene.systems['mindar-image-system']?.stop();
  } catch (error) {
    console.warn(error);
  }
}

scene.addEventListener('loaded', () => {
  sceneReady = true;
  ready();
});

terrain.addEventListener('terrain-ready', () => {
  modelReady = true;
  ready();
});

terrain.addEventListener('terrain-error', event => {
  fail('地形模型處理失敗：' + event.detail.message);
});

terrain.addEventListener('model-error', () => {
  fail(
    '地形模型載入失敗，請確認 GLB 檔名和 index.html 裡的 ' +
    'gltf-model 一致，並放在同一個資料夾。'
  );
});

if (terrain.dataset.modelReady === 'true') {
  modelReady = true;
}

if (terrain.dataset.modelError) {
  fail(terrain.dataset.modelError);
}

ready();

scene.addEventListener('arReady', () => {
  if (failed) return;

  starting = false;
  running = true;

  start.hidden = true;
  bottom.hidden = false;

  status.textContent =
    '請把鏡頭對準完整的台地圖卡。';
});

scene.addEventListener('arError', () => {
  fail(
    '無法啟動鏡頭，請確認相機權限，' +
    '以及 targets.mind 是否存在。'
  );
});

start.addEventListener('click', async () => {
  if (
    failed ||
    starting ||
    running ||
    !modelReady ||
    !sceneReady
  ) {
    return;
  }

  if (
    !window.isSecureContext ||
    !navigator.mediaDevices?.getUserMedia
  ) {
    status.textContent =
      '請使用手機瀏覽器開啟 HTTPS 網址，' +
      '並允許相機權限。';
    return;
  }

  starting = true;
  start.disabled = true;
  start.textContent = '啟動中';

  status.textContent = '請允許網站使用相機……';

  try {
    await scene.systems['mindar-image-system'].start();
  } catch (error) {
    console.error(error);
    fail(
      'AR 啟動失敗：請允許相機權限，' +
      '並確認 targets.mind 已上傳。'
    );
  }
});

target.addEventListener('targetFound', () => {
  if (!failed) {
    status.textContent =
      '辨識成功！可以縮放、旋轉或換角度觀察台地。';
  }
});

target.addEventListener('targetLost', () => {
  if (running) {
    status.textContent =
      '圖卡離開鏡頭，請重新對準圖卡。';
  }
});


/* ============================================================
   縮放
   ============================================================ */

function setZoom(percent) {
  zoom = Math.round(
    Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Number(percent)))
  );

  const s = zoom / 100;

  zoomBox.object3D.scale.set(s, s, s);

  zoomSlider.value = zoom;
  zoomValue.textContent = zoom + '%';
}

zoomSlider.addEventListener('input', event => {
  setZoom(event.target.value);
});

document.querySelector('#zoomIn')
  .addEventListener('click', () => {
    setZoom(zoom + ZOOM_STEP);
  });

document.querySelector('#zoomOut')
  .addEventListener('click', () => {
    setZoom(zoom - ZOOM_STEP);
  });


/* ============================================================
   旋轉（在圖卡平面上轉）
   ============================================================ */

function setAngle(degrees) {
  angle = ((degrees % 360) + 360) % 360;

  spin.object3D.rotation.set(
    0,
    0,
    AFRAME.THREE.MathUtils.degToRad(angle)
  );
}

document.querySelector('#rotateLeft')
  .addEventListener('click', () => {
    setAngle(angle + ROTATE_STEP);
  });

document.querySelector('#rotateRight')
  .addEventListener('click', () => {
    setAngle(angle - ROTATE_STEP);
  });


/* ============================================================
   換角度
   ============================================================ */

function setView(index) {
  viewIndex = index % VIEWS.length;

  const [name, degrees] = VIEWS[viewIndex];

  tilt.object3D.rotation.set(
    AFRAME.THREE.MathUtils.degToRad(degrees),
    0,
    0
  );

  viewButton.textContent = '換角度：' + name;
}

viewButton.addEventListener('click', () => {
  setView(viewIndex + 1);
});


/* ============================================================
   重設
   ============================================================ */

document.querySelector('#reset')
  .addEventListener('click', () => {
    setZoom(100);
    setAngle(0);
    setView(0);
  });


/* ============================================================
   手勢：單指左右滑動旋轉、雙指開合縮放
   （在上下面板上操作時不觸發）
   ============================================================ */

let touchStartX = 0;
let touchStartAngle = 0;
let pinchStartDistance = 0;
let pinchStartZoom = 100;

function touchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

window.addEventListener('touchstart', event => {
  if (!running || event.target.closest('.panel')) return;

  if (event.touches.length === 1) {
    touchStartX = event.touches[0].clientX;
    touchStartAngle = angle;
  }

  if (event.touches.length === 2) {
    pinchStartDistance = touchDistance(event.touches);
    pinchStartZoom = zoom;
  }
}, { passive: true });

window.addEventListener('touchmove', event => {
  if (!running || event.target.closest('.panel')) return;

  if (event.touches.length === 1) {
    const dx = event.touches[0].clientX - touchStartX;
    setAngle(touchStartAngle - dx * 0.5);
  }

  if (event.touches.length === 2 && pinchStartDistance > 0) {
    const ratio = touchDistance(event.touches) / pinchStartDistance;
    setZoom(pinchStartZoom * ratio);
  }
}, { passive: true });

window.addEventListener('touchend', event => {
  // 雙指放開一指時，改以剩下那指重新計算旋轉
  if (event.touches.length === 1) {
    touchStartX = event.touches[0].clientX;
    touchStartAngle = angle;
    pinchStartDistance = 0;
  }
}, { passive: true });


/* ============================================================
   離開頁面時關閉鏡頭
   ============================================================ */

window.addEventListener('pagehide', () => {
  try {
    scene.systems['mindar-image-system']?.stop();
  } catch (error) {
    console.warn(error);
  }
});
</script>

</body>
</html>
